name: Windows-exe

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "tools/**"
      - "packaging/**"
      - "calibrations/**"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller
      - name: Tests
        run: python -m pytest -q backend
      - name: exe bauen
        run: pyinstaller packaging/stresscell.spec --noconfirm
      - name: exe starten (Simulation) und Oberfläche abfragen
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\StressCell\StressCell.exe -ArgumentList "--sim","20","--no-browser" -PassThru -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8020/ -TimeoutSec 5; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          try { $h = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8020/help -TimeoutSec 5; Write-Host "help:" $h.StatusCode } catch { Write-Host "help failed" }
          Stop-Process -Id $p.Id -Force
          Get-Content out.txt, err.txt
          if (-not $ok) { throw "StressCell.exe did not answer on port 8020" }
      - name: Gerätecheck ohne Geräte (darf FAIL melden, darf nicht abstürzen)
        shell: pwsh
        run: |
          "" | dist\StressCell\StressCell.exe check
          if ($LASTEXITCODE -ne 0) { throw "check crashed" }
      - uses: actions/upload-artifact@v4
        with:
          name: StressCell-Windows
          path: dist/StressCell
          retention-days: 90
