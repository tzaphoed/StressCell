# StressCell Konfiguration. Die Werte hier sind die verbindlichen Grenzen.
# Alles Schreibende läuft durch core/safety.py und wird nur hiergegen geprüft.

[server]
host = "127.0.0.1"
port = 8020

[paths]
data_dir = "../data"
log_dir = "../logs"
calibration_dir = "../calibrations"
sequence_dir = "../sequences"

[mode]
simulate = true          # true: Simulation, false: echte Geräte
sim_speed = 10.0         # Zeitraffer der Simulation
read_only = false        # true: nur lesen, jeder Setzbefehl wird abgelehnt
ppms_read = true         # PPMS-Daten lesen (T, B, Kammer). false: kein PPMS, engstes Fenster (300 K, Kammer unbekannt)
ppms_control = true      # StressCell darf T, B und Kammer stellen. false: das macht MultiVu, StressCell liest nur
ppms_emergency_hold = true  # auch ohne Steuerung: Aufwärmen anhalten, wenn die Spannung nicht fällt

[monitor]
tick_s = 1.0             # Takt von Abfrage, Guard und Kraftregler
log_interval_s = 5.0     # Tageslog
history_s = 21600        # so viel Verlauf bekommt eine neu verbundene GUI
watchdog_s = 60.0        # Abfrage länger als das hängt: 300-K-Fenster

[limits]
# Spannungsfenster: core/fc100.py, Datenblatt FC100 v2.4, Tabelle 2. Nicht hier einstellbar.
T_margin_K = 2.0         # Thermometer sitzt nicht an den Stapeln
T_lookahead_s = 60.0     # beim Aufwärmen: Fenster für T + dT/dt * lookahead
T_cell_tau_s = 300.0     # Zelle folgt dem Thermometer verzögert. Beim Abkühlen zählt der langsame Wert. Messen!
T_jump_K = 5.0           # Sprung je Abfrage, der als Lesefehler gilt
T_stale_s = 15.0         # so lange gilt die letzte Temperatur, danach das 300-K-Fenster
slew_default_V_s = 1.0   # ohne Angabe. Bei 300 K etwa 1,7 N/s (beide Kanäle laufen gegenläufig)
slew_max_V_s = 10.0      # RP100-Handbuch: unter 100 V/s, langsamer heizt weniger
guard_slew_V_s = 20.0    # Rampe, mit der der Guard zurückfährt
output_off_V_max = 5.0   # Ausgänge nur nahe 0 V aus, sonst Kraftsprung an der Probe
transition_V_max = 50.0  # Betrag je Kanal, während die Kammer pumpt, flutet oder spült
sealed_V_max = 80.0      # Betrag je Kanal in abgeschlossenem Niederdruck-He. Razorbill: Bogen ab knapp über 100 V
current_trip_A = 2e-3    # darüber: Lichtbogen oder Kurzschluss angenommen, Ausgänge aus
current_trip_ticks = 2   # Zähler, steigt je Überschreitung um 1, fällt sonst um 0,25
force_max_N = 20.0       # Kraftgrenze für DIESE Probe. Vor dem Messen anpassen!
force_step_trip_N = 0.5  # Mindestabfall je Abfrage, der nicht vom Drive kommt: Probe gerissen
force_step_frac = 0.3    # und mindestens dieser Anteil der Kraft
G_ceiling_N_V = 1.3      # obere Grenze dF/dD, Datenblatt 170 N bei 140 V
tare_D_max_V = 1.0       # Tare nur nahe Drive null
tare_F_max_N = 10.0      # größte Nullpunktverschiebung ohne accept
tare_T_min_K = 250.0     # darunter braucht Tare accept: sonst verschwindet thermische Kraft aus der Anzeige
force_noise_N = 0.05     # Startwert des Kraftrauschens, wird im Lauf gemessen
T_min = 1.8              # K
T_max = 320.0            # K, Datenblatt: maximale Betriebstemperatur 50 °C
T_rate_max = 10.0        # K/min, Datenblatt: niemals schneller
B_max = 9.0              # T, an den eigenen Magneten anpassen
B_rate_max = 0.6         # T/min
excitation_max_Vrms = 14.0  # Datenblatt: 40 V Spitze-Spitze, entspricht 14,1 V rms
wait_max_s = 172800
stale_s = 5.0            # so alt darf ein Messwert höchstens sein

[chamber]
# safe_states: volles Fenster. sealed_states: sealed_V_max. Alles andere: transition_V_max.
safe_states = ["HiVac"]
sealed_states = ["Purged and Sealed", "Vented and Sealed", "Sealed (condition unknown)"]

[force_loop]
G0_N_per_V = 0.5         # Startwert dF/dD, wird im Lauf nachgeführt
G_min = 0.02
G_max = 5.0
lambda = 0.5             # Schrittweite relativ zum vollen Korrekturschritt
stall_V = 30.0            # so viel Drive in einer Richtung ohne stall_N Kraftänderung: Probe nicht mehr im Kraftfluss
stall_N = 0.6
against_V = 4.0           # so viel Drive, bis eine Gegenbewegung als falsches Vorzeichen zählt
max_step_V = 2.0         # größter Drive-Schritt je Regelschritt
settle_V = 0.5           # erst nachregeln, wenn die Rampe so nah am Ziel ist
default_tol_N = 0.05

[ac]
# AC-Elastokalorik. Die Anregung liegt auf einer Stapelgruppe, der Offset auf der anderen.
# Empfohlener Aufbau ohne RP100 (Handbuch, Aufbau A): SR860 SINE OUT -> R2 = 240 Ohm -> Zugstapel.
enabled = true
source = "lockin"         # lockin: Oszillator des Lock-ins | generator: Funktionsgenerator + externe Referenz
channel = "tension"       # Zugstapel: 3,1 uF, halber Strom gegenüber der Druckgruppe
C_F = 3.1e-6              # Datenblatt, 300 K. Fällt beim Abkühlen, siehe Handbuch "RC-Korrektur"
gain = 1.414              # V Spitze am Stapel je V rms am Ausgang bei tiefer Frequenz. Direkt: 1,414.
                          # Mit Tegam 2350: 70,7. Mit dem Oszilloskop am Stapel messen!
series_R_ohm = 290.0      # R2 plus 50 Ohm Ausgang. Ergibt den RC-Tiefpass, die Software rechnet ihn heraus.
gain_verified = false     # ohne true läuft an echten Geräten keine Anregung
V_max = 2.5               # größte Spitzenspannung am Stapel. Für NiMnSn reichen 0,3 bis 2 V
current_max_A = 5e-3      # Datenblatt: 10 mA nicht überschreiten. Halber Wert als Reserve
f_min_Hz = 1.0
f_max_Hz = 5000.0
harmonic = 1
time_constant_s = 1.0
preamp_gain = 100.0       # Vorverstärker vor dem Lock-in (SR560), genau wie am Gerät eingestellt
bridge_guard_frac = 0.03  # mit AH-Brücke: Detektion nicht näher als 3 % an k x 1 kHz
G_drive_tol_V = 10.0      # dF/dD gilt nur bis so weit vom Offset, an dem es gemessen wurde

[thermometry]
dc_gain = 1.0             # Verstärkung vor dem Nanovoltmeter/DMM (1: direkt am Thermoelement)

[sample]
name = "sample"
area_mm2 = 0.1           # für die Spannung in MPa
length_mm = 1.0

[cell_thermometer]
# Eigenes Thermometer an der Zelle (Cernox). Handbuch Kapitel "Zellthermometer".
# source: none | lakeshore | ppms_bridge | dmm
source = "lakeshore"      # dein Aufbau: Cernox am Lake Shore mit Kalibrierkurve. Modell, Adresse, Eingang prüfen!
model = "336"             # lakeshore: 218 | 224 | 335 | 336 | 350 | 372
address = "GPIB0::12::INSTR"
input = "A"               # Lake Shore Eingang (218 und 372: Nummer, z. B. "1")
channel = 2               # ppms_bridge: Kanal der Resistivity-Option
current_uA = 10.0         # ppms_bridge: Messstrom. Cernox heizt sich bei tiefer T sonst selbst
calibration = "cernox.340"  # Kurve R -> T im Ordner calibrations (.340 oder csv R_ohm,T_K)
curve_in = "device"       # lakeshore: device = Kurve im Gerät (KRDG?) | software = StressCell rechnet mit calibration
window = "max"            # max: höhere aus PPMS und Cernox (sicher in beide Richtungen) | cernox: nur Cernox
margin_K = 1.0            # Reserve auf die Cernox-Temperatur
stale_s = 15.0            # so lange gilt der letzte Wert

[capacitance]
frequency_Hz = 1000.0
excitation_Vrms = 1.0
calibration = "FC100_0260.toml"   # deine Zelle, Blatt 0260-FC100-b. cell_example.toml ist die lineare Testzelle

[instruments]
# Welche Geräte im Schrank stehen, entscheidet hier. Alles Weitere steht im Handbuch,
# Kapitel "Geräte" und "Konfiguration". check_instruments.py fragt jedes Gerät nur ab.
#
# supply:  rp100         beide Stapel am RP100 (Razorbill), entlädt selbst
#          split         jede Stapelgruppe eigene Quelle, siehe [instruments.tension] und
#                        [instruments.compression] unten. Der Weg ohne RP100.
#          keithley2400  zwei Keithley 2400 (alte Variante, braucht Kurzschlussbox)
#          lockin_amp    Lock-in-Aux + Verstärker auf Druck, Zug nur AC (alte Variante)
supply = "split"
# cap:     e4980al | e4980a | hp4284a | ah2500a | ah2550a | ah2700a | lockin_cap
cap = "e4980al"
cryo = "multipyvu"
# sample:  none | ppms_bridge | k2182a | dmm344xx, auch als Liste, z. B. ["ppms_bridge", "k2182a"]
sample = "none"
# lockin_model: sr860 | sr865 | sr830 | sr7265 | sr7270
lockin_model = "sr860"
lockin = "GPIB0::4::INSTR"
lockin_vrms_max = 2.0     # SR860: 2, SR830/SR7265: 5. Mit R2 hält das den Strom unter 10 mA

# Funktionsgenerator statt Lock-in-Oszillator ([ac] source = "generator"):
# generator_model: 33500b | 33600a | 33210a | 33220a. SYNC-Ausgang an den Referenzeingang.
generator_model = "33500b"
generator = "USB0::0x0957::0x2C07::MY00000000::INSTR"
generator_vlimit_V = 3.0  # 33500B/33600A: harte Ausgangsgrenze im Gerät, V Spitze
generator_vrms_max = 2.0

capmeter = "GPIB0::28::INSTR"
capmeter_model = "sr830"  # nur für cap = lockin_cap: sr830 | sr860
lockin_cap_gain = "1M"    # Stromeingang 1M (1e6 V/A) oder 100M
lockin_cap_phase_deg = 0.0

voltmeter = "GPIB0::7::INSTR"   # für sample = k2182a oder dmm344xx
voltmeter_nplc = 1.0

multipyvu_host = "127.0.0.1"
multipyvu_port = 27183   # Vorgabe von MultiPyVu 3.8
ppms_bridge_channel = 1
ppms_bridge_current_uA = 1000.0

# alte Varianten
rp100 = "ASRL5::INSTR"
rp100_ch_tension = 1     # Razorbill-Schnellstart: üblicherweise 1 = Zug, 2 = Druck
rp100_ch_compression = 2
keithley_tension = "GPIB0::24::INSTR"
keithley_compression = "GPIB0::25::INSTR"
keithley_compliance_A = 6e-3
keithley_discharge_box_fitted = false
amp_dc_gain = 50.0       # Hochspannungsverstärker am Aux-Ausgang, Tegam 2350: fest 50
amp_discharge_box_fitted = false
amp_gain_verified = false

[instruments.tension]
# Zugstapel: Adern rot (+) und weiß (-), Datenblatt Tabelle 1.
# source: rp100 | smu | hv_amp | ac_only | grounded
source = "ac_only"        # Aufbau A: nur AC über R2, Gleichspannung 0 V
bleeder_R_ohm = 1.0e6     # Entladewiderstand parallel zum Stapel, >= 500 V Spannungsfestigkeit
bleeder_fitted = false    # erst true, wenn er wirklich eingebaut ist

[instruments.compression]
# Druckstapel: Adern braun (+) und blau (-).
source = "smu"
model = "keithley2400"    # keithley2400 | keithley2410 | keithley2420 | keithley2450 | keithley2600 | b2900
address = "GPIB0::24::INSTR"
channel = 1               # keithley2600: "a" oder "b", b2900: 1 oder 2
compliance_A = 6e-3       # Hardware-Strombegrenzung der SMU
series_R_ohm = 15000.0    # R1 in der Anschlussbox, wie im RP100
bleeder_R_ohm = 1.0e6
bleeder_fitted = false
# Für hv_amp zusätzlich: gain (V am Stapel je V Aux), gain_verified, aux (Nummer), lockin_model

[sim]
