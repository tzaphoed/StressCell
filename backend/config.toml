# StressCell Konfiguration. Die Werte hier sind die verbindlichen Grenzen.
# Alles Schreibende läuft durch core/safety.py und wird nur hiergegen geprüft.

[server]
host = "127.0.0.1"
port = 8020

[paths]
data_dir = "../data"
log_dir = "../logs"
calibration_dir = "../calibrations"
sequence_dir = "../sequences"

[mode]
simulate = true          # true: Simulation, false: echte Geräte
sim_speed = 10.0         # Zeitraffer der Simulation
read_only = false        # true: nur lesen, jeder Setzbefehl wird abgelehnt

[monitor]
tick_s = 1.0             # Takt von Abfrage, Guard und Kraftregler
log_interval_s = 5.0     # Tageslog
history_s = 21600        # so viel Verlauf bekommt eine neu verbundene GUI
watchdog_s = 60.0        # Abfrage länger als das hängt: 300-K-Fenster

[limits]
# Spannungsfenster: core/fc100.py, Datenblatt FC100 v2.4, Tabelle 2. Nicht hier einstellbar.
T_margin_K = 2.0         # Thermometer sitzt nicht an den Stapeln
T_lookahead_s = 60.0     # beim Aufwärmen: Fenster für T + dT/dt * lookahead
T_cell_tau_s = 300.0     # Zelle folgt dem Thermometer verzögert. Beim Abkühlen zählt der langsame Wert. Messen!
T_jump_K = 5.0           # Sprung je Abfrage, der als Lesefehler gilt
T_stale_s = 15.0         # so lange gilt die letzte Temperatur, danach das 300-K-Fenster
slew_default_V_s = 1.0   # ohne Angabe. Bei 300 K etwa 1,7 N/s (beide Kanäle laufen gegenläufig)
slew_max_V_s = 10.0      # RP100-Handbuch: unter 100 V/s, langsamer heizt weniger
guard_slew_V_s = 20.0    # Rampe, mit der der Guard zurückfährt
output_off_V_max = 5.0   # Ausgänge nur nahe 0 V aus, sonst Kraftsprung an der Probe
transition_V_max = 50.0  # Betrag je Kanal, während die Kammer pumpt, flutet oder spült
sealed_V_max = 80.0      # Betrag je Kanal in abgeschlossenem Niederdruck-He. Razorbill: Bogen ab knapp über 100 V
current_trip_A = 2e-3    # darüber: Lichtbogen oder Kurzschluss angenommen, Ausgänge aus
current_trip_ticks = 2   # Zähler, steigt je Überschreitung um 1, fällt sonst um 0,25
force_max_N = 20.0       # Kraftgrenze für DIESE Probe. Vor dem Messen anpassen!
force_step_trip_N = 0.5  # Mindestabfall je Abfrage, der nicht vom Drive kommt: Probe gerissen
force_step_frac = 0.3    # und mindestens dieser Anteil der Kraft
G_ceiling_N_V = 1.3      # obere Grenze dF/dD, Datenblatt 170 N bei 140 V
tare_D_max_V = 1.0       # Tare nur nahe Drive null
tare_F_max_N = 10.0      # größte Nullpunktverschiebung ohne accept
tare_T_min_K = 250.0     # darunter braucht Tare accept: sonst verschwindet thermische Kraft aus der Anzeige
force_noise_N = 0.05     # Startwert des Kraftrauschens, wird im Lauf gemessen
T_min = 1.8              # K
T_max = 320.0            # K, Datenblatt: maximale Betriebstemperatur 50 °C
T_rate_max = 10.0        # K/min, Datenblatt: niemals schneller
B_max = 9.0              # T, an den eigenen Magneten anpassen
B_rate_max = 0.6         # T/min
excitation_max_Vrms = 14.0  # Datenblatt: 40 V Spitze-Spitze, entspricht 14,1 V rms
wait_max_s = 172800
stale_s = 5.0            # so alt darf ein Messwert höchstens sein

[chamber]
# safe_states: volles Fenster. sealed_states: sealed_V_max. Alles andere: transition_V_max.
safe_states = ["HiVac"]
sealed_states = ["Purged and Sealed", "Vented and Sealed", "Sealed (condition unknown)"]

[force_loop]
G0_N_per_V = 0.5         # Startwert dF/dD, wird im Lauf nachgeführt
G_min = 0.02
G_max = 5.0
lambda = 0.5             # Schrittweite relativ zum vollen Korrekturschritt
stall_V = 30.0            # so viel Drive in einer Richtung ohne stall_N Kraftänderung: Probe nicht mehr im Kraftfluss
stall_N = 0.6
against_V = 4.0           # so viel Drive, bis eine Gegenbewegung als falsches Vorzeichen zählt
max_step_V = 2.0         # größter Drive-Schritt je Regelschritt
settle_V = 0.5           # erst nachregeln, wenn die Rampe so nah am Ziel ist
default_tol_N = 0.05

[ac]
# AC-Elastokalorik. Die Anregung liegt auf einer Stapelgruppe, der Offset auf der anderen.
enabled = true
channel = "tension"       # Zugstapel: 3,1 uF, halber Strom gegenüber der Druckgruppe
C_F = 3.1e-6              # Datenblatt, 300 K
gain = 25.0               # V Spitze am Stapel je V rms am Oszillatorausgang. Mit dem Oszilloskop messen!
gain_verified = false     # ohne true läuft an echten Geräten keine Anregung
V_max = 20.0              # Spitzenspannung
current_max_A = 5e-3      # Datenblatt: 10 mA nicht überschreiten. Halber Wert als Reserve
f_min_Hz = 1.0
f_max_Hz = 5000.0
harmonic = 1
time_constant_s = 1.0
preamp_gain = 100.0       # Vorverstärker vor dem Lock-in

[sample]
name = "sample"
area_mm2 = 0.1           # für die Spannung in MPa
length_mm = 1.0

[capacitance]
frequency_Hz = 1000.0
excitation_Vrms = 1.0
calibration = "FC100_0260.toml"   # deine Zelle, Blatt 0260-FC100-b. cell_example.toml ist die lineare Testzelle

[instruments]
supply = "rp100"         # rp100 | keithley2400 | lockin_amp
cap = "e4980al"          # e4980al | ah2550a | ah2700a
cryo = "multipyvu"
sample = "none"          # none | ppms_bridge

rp100 = "ASRL5::INSTR"
rp100_ch_tension = 1     # Razorbill-Schnellstart: üblicherweise 1 = Zug, 2 = Druck
rp100_ch_compression = 2

keithley_tension = "GPIB0::24::INSTR"
keithley_compression = "GPIB0::25::INSTR"
keithley_compliance_A = 6e-3
# true erst eintragen, wenn die Kurzschlussbox verbaut ist: Docs Kapitel "Keithley statt RP100".
keithley_discharge_box_fitted = false

lockin = "GPIB0::4::INSTR"
amp_dc_gain = 50.0       # Hochspannungsverstärker am Aux-Ausgang, Tegam 2350: fest 50
amp_discharge_box_fitted = false
amp_gain_verified = false   # Verstärkung am Stapel gemessen?

capmeter = "GPIB0::28::INSTR"

multipyvu_host = "127.0.0.1"
multipyvu_port = 27183   # Vorgabe von MultiPyVu 3.8
ppms_bridge_channel = 1
ppms_bridge_current_uA = 1000.0

[sim]
